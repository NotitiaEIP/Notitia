" font-weight="700" fill="#1E6CCC" text-anchor="middle">In progress</text><path d="M401.0 212 L401.0 248" stroke="#E5E3EA" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="482" y="100" width="138" height="112" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><circle cx="551.0" cy="124" r="12" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.5"/><text x="551.0" y="128.5" font-size="12" font-weight="700" fill="#635CE4" text-anchor="middle">4</text><text x="551.0" y="160" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Pull request</text><text x="551.0" y="179" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">titre en anglais</text><text x="551.0" y="196" font-size="11" font-weight="400" fill="#5E5C69" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">Closes …#12</text><path d="M621 156 L631 156" fill="none" stroke="#635CE4" stroke-width="1.8" marker-end="url(#m635CE4)"/><rect x="496" y="250" width="110" height="30" rx="15" fill="#FCEFD9" stroke="#A35200" stroke-width="1.2"/><text x="551.0" y="269.5" font-size="11.5" font-weight="700" fill="#A35200" text-anchor="middle">Need review</text><path d="M551.0 212 L551.0 248" stroke="#E5E3EA" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="632" y="100" width="138" height="112" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><circle cx="701.0" cy="124" r="12" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.5"/><text x="701.0" y="128.5" font-size="12" font-weight="700" fill="#635CE4" text-anchor="middle">5</text><text x="701.0" y="160" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">CI verte</text><text x="701.0" y="179" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">fusion automatique</text><text x="701.0" y="196" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">en squash</text><path d="M771 156 L781 156" fill="none" stroke="#635CE4" stroke-width="1.