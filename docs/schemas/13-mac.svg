<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Le Mac : ce qui reste, ce qui change" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Le Mac : ce qui reste, ce qui change</title><defs><symbol id="i-mac" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M12 16.5v3.5M8.5 20h7"/></symbol><symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></symbol><symbol id="i-fichier" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h7.5l4 4v14h-11.5z"/><path d="M14 3v4h4"/></symbol><symbol id="i-coeur" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></symbol><marker id="m5E5C69" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E5C69"/></marker><marker id="m882DCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#882DCD"/></marker><marker id="m8A8895" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8895"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="468.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Le Mac : ce qui reste, ce qui change</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">L'interface reste en SwiftUI. Les réunions passent par le cœur commun.</text><text x="32.0" y="108.0" font-size="11.5" font-weight="700" fill="#5E5C69" text-anchor="start">AUJOURD'HUI</text><text x="496.0" y="108.0" font-size="11.5" font-weight="700" fill="#882DCD" text-anchor="start">AVEC LE CŒUR COMMUN</text><rect x="32.0" y="120.0" width="432.0" height="70.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="46.0" y="150.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Interface SwiftUI</text><text x="46.0" y="169.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Composants et réglages du Mac</text><rect x="32.0" y="206.0" width="432.0" height="104.0" rx="10" fill="#E1F3EA" stroke="#15724A" stroke-width="1.5"/><text x="46.0" y="244.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">NotitiaKit, en Swift</text><text x="46.0" y="263.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Toute la logique : notes, réunions, résumés</text><text x="46.0" y="281.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Moteurs Apple : transcription, résumé</text><rect x="32.0" y="326.0" width="432.0" height="70.0" rx="10" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.5"/><text x="46.0" y="356.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Notes en blocs, propres au Mac</text><text x="46.0" y="375.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Illisibles par le téléphone aujourd'hui</text><rect x="496.0" y="120.0" width="432.0" height="70.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="510.0" y="150.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Interface SwiftUI</text><text x="510.0" y="169.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Inchangée dans son principe</text><rect x="496.0" y="206.0" width="208.0" height="104.0" rx="10" fill="#E1F3EA" stroke="#15724A" stroke-width="1.5"/><text x="510.0" y="244.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">NotitiaKit</text><text x="510.0" y="263.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Moteurs Apple,</text><text x="510.0" y="281.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">éditeur de notes</text><rect x="720.0" y="206.0" width="208.0" height="104.0" rx="10" fill="#F3E8FB" stroke="#882DCD" stroke-width="2"/><text x="734.0" y="244.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Cœur Rust</text><text x="734.0" y="263.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Réunions, compte rendu,</text><text x="734.0" y="281.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">recherche, lien</text><rect x="496.0" y="326.0" width="432.0" height="70.0" rx="10" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.5"/><text x="510.0" y="356.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Réunions au format .notitia</text><text x="510.0" y="375.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Les mêmes fichiers que sur le téléphone</text><path d="M248.0 190.0 L248.0 204.0" fill="none" stroke="#5E5C69" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m5E5C69)"/><path d="M248.0 310.0 L248.0 324.0" fill="none" stroke="#5E5C69" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m5E5C69)"/><path d="M600.0 190.0 L600.0 204.0" fill="none" stroke="#5E5C69" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m5E5C69)"/><path d="M824.0 190.0 L824.0 204.0" fill="none" stroke="#5E5C69" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m5E5C69)"/><path d="M824.0 310.0 L824.0 324.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M468.0 258.0 L490.0 258.0" fill="none" stroke="#8A8895" stroke-width="2" stroke-linejoin="round" marker-end="url(#m8A8895)"/><text x="480.0" y="430.0" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="middle">L'éditeur de notes de Lucas reste hors du cœur : le cadre du projet ne le retient pas pour cette année.</text><use href="#i-mac" x="434.0" y="132.0" width="18" height="18" color="#1E6CCC"/><use href="#i-mac" x="898.0" y="132.0" width="18" height="18" color="#1E6CCC"/><use href="#i-code" x="434.0" y="218.0" width="18" height="18" color="#15724A"/><use href="#i-fichier" x="434.0" y="338.0" width="18" height="18" color="#5E5C69"/><use href="#i-code" x="674.0" y="218.0" width="18" height="18" color="#15724A"/><use href="#i-coeur" x="898.0" y="218.0" width="18" height="18" color="#882DCD"/><use href="#i-fichier" x="898.0" y="338.0" width="18" height="18" color="#5E5C69"/></svg>
