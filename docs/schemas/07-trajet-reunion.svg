<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Le trajet d'une réunion" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Le trajet d'une réunion</title><defs><symbol id="i-micro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol><symbol id="i-cadenas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3M12 14.5v2.5"/></symbol><symbol id="i-parole" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-4.5 3.5V16H4z"/><path d="M8 9.5h8M8 12.5h5"/></symbol><symbol id="i-ia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.7 4.8 4.8 1.7-4.8 1.7L11 16.5l-1.7-4.8L4.5 10l4.8-1.7z"/><path d="M18 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol><symbol id="i-compte-rendu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><path d="M4 6.5l1.3 1.3L7.5 5.3M4 12l1.3 1.3 2.2-2.5M4 17.5l1.3 1.3 2.2-2.5"/></symbol><symbol id="i-recherche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></symbol><symbol id="i-telephone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol><marker id="m882DCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#882DCD"/></marker><marker id="m0E7C70" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E7C70"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="498.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Le trajet d'une réunion</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">De la voix au compte rendu : ce qui se passe, et à quel étage.</text><rect x="32.0" y="98.0" width="896.0" height="92.0" rx="12" fill="#E8F0FB" fill-opacity="0.6" stroke="#1E6CCC" stroke-width="0"/><text x="48.0" y="118.0" font-size="10.5" font-weight="700" fill="#1E6CCC" text-anchor="start">FAÇADE</text><rect x="32.0" y="198.0" width="896.0" height="122.0" rx="12" fill="#F3E8FB" fill-opacity="0.6" stroke="#882DCD" stroke-width="0"/><text x="48.0" y="218.0" font-size="10.5" font-weight="700" fill="#882DCD" text-anchor="start">CŒUR RUST</text><rect x="32.0" y="328.0" width="896.0" height="92.0" rx="12" fill="#F3F2F7" fill-opacity="0.6" stroke="#5E5C69" stroke-width="0"/><text x="912.0" y="348.0" font-size="10.5" font-weight="700" fill="#5E5C69" text-anchor="end">MOTEURS ET DISQUE</text><rect x="48.0" y="128.0" width="152.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="139.0" y="159.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">1. Micro</text><rect x="48.0" y="232.0" width="152.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="124.0" y="258.2" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">2. Découpe</text><text x="124.0" y="275.9" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">et compression</text><rect x="48.0" y="358.0" width="152.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="139.0" y="387.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">3. Audio chiffré</text><rect x="226.0" y="232.0" width="152.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="317.0" y="258.2" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">4. Transcription</text><text x="302.0" y="275.9" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">qui a dit quoi</text><rect x="226.0" y="358.0" width="152.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="317.0" y="387.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Moteur de voix</text><rect x="404.0" y="232.0" width="152.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="495.0" y="258.2" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">5. Compte rendu</text><text x="480.0" y="275.9" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">décisions, actions</text><rect x="404.0" y="358.0" width="152.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="495.0" y="387.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Moteur de texte</text><rect x="582.0" y="232.0" width="152.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="673.0" y="258.2" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">6. Recherche</text><text x="658.0" y="275.9" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">index des réunions</text><rect x="582.0" y="358.0" width="152.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="673.0" y="387.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Texte chiffré</text><rect x="760.0" y="128.0" width="152.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="851.0" y="150.2" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">7. Compte rendu</text><text x="836.0" y="167.9" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">affiché à l'écran</text><path d="M124.0 182.0 L124.0 230.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M124.0 294.0 L124.0 356.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M302.0 294.0 L302.0 356.0" fill="none" stroke="#0E7C70" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m0E7C70)" marker-start="url(#m0E7C70)"/><path d="M480.0 294.0 L480.0 356.0" fill="none" stroke="#0E7C70" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m0E7C70)" marker-start="url(#m0E7C70)"/><path d="M658.0 294.0 L658.0 356.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M200.0 263.0 L224.0 263.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M378.0 263.0 L402.0 263.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M556.0 263.0 L580.0 263.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M734.0 263.0 L836.0 263.0 L836.0 184.0" fill="none" stroke="#882DCD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m882DCD)"/><text x="480.0" y="452.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">La façade ne fait qu'ouvrir le micro et afficher le résultat. Tout le reste est le même code sur chaque appareil.</text><text x="480.0" y="472.0" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="middle">Les deux moteurs sont remplaçables : un moteur ouvert aujourd'hui, nos modèles maison ensuite.</text><use href="#i-micro" x="84.0" y="142.8" width="18" height="18" color="#5E5C69"/><use href="#i-cadenas" x="59.0" y="370.8" width="18" height="18" color="#5E5C69"/><use href="#i-parole" x="237.0" y="241.9" width="18" height="18" color="#5E5C69"/><use href="#i-ia" x="243.2" y="370.8" width="18" height="18" color="#5E5C69"/><use href="#i-compte-rendu" x="418.1" y="241.9" width="18" height="18" color="#5E5C69"/><use href="#i-ia" x="418.1" y="370.8" width="18" height="18" color="#5E5C69"/><use href="#i-recherche" x="605.5" y="241.9" width="18" height="18" color="#5E5C69"/><use href="#i-cadenas" x="602.4" y="370.8" width="18" height="18" color="#5E5C69"/><use href="#i-telephone" x="774.1" y="133.9" width="18" height="18" color="#5E5C69"/></svg>
