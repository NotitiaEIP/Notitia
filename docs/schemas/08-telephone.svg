<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="L'app téléphone : des écrans partagés sur un cœur commun" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>L'app téléphone : des écrans partagés sur un cœur commun</title><defs><symbol id="i-telephone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol><symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></symbol><symbol id="i-coeur" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></symbol><marker id="m1E6CCC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E6CCC"/></marker><marker id="m635CE4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#635CE4"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="518.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">L'app téléphone : des écrans partagés sur un cœur commun</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Android et iPhone affichent les mêmes écrans. Seul ce qui touche au système est écrit deux fois.</text><rect x="32.0" y="100.0" width="896.0" height="92.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="46.0" y="132.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Écrans Compose partagés, en Kotlin</text><text x="46.0" y="151.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Réunions, enregistrement, compte rendu, actions, recherche</text><text x="46.0" y="169.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Le thème NotitiaTheme porte la charte : couleurs, police, espacements</text><rect x="32.0" y="214.0" width="440.0" height="104.0" rx="10" fill="#E1F3EA" stroke="#15724A" stroke-width="1.5"/><text x="46.0" y="252.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Couche Android, en Kotlin</text><text x="46.0" y="271.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Service micro au premier plan</text><text x="46.0" y="289.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Widget, notifications, permissions</text><rect x="488.0" y="214.0" width="440.0" height="104.0" rx="10" fill="#E1F3EA" stroke="#15724A" stroke-width="1.5"/><text x="502.0" y="252.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Couche iPhone, en Swift</text><text x="502.0" y="271.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Session audio en arrière-plan</text><text x="502.0" y="289.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Widget, Live Activity, feuille de partage</text><path d="M252.0 192.0 L252.0 212.0" fill="none" stroke="#1E6CCC" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1E6CCC)"/><path d="M708.0 192.0 L708.0 212.0" fill="none" stroke="#1E6CCC" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1E6CCC)"/><path d="M252.0 318.0 L252.0 384.0" fill="none" stroke="#635CE4" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m635CE4)"/><rect x="188.5" y="338.8" width="127.1" height="22.5" rx="11.25" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.2"/><text x="252.0" y="354.0" font-size="11.5" font-weight="700" fill="#635CE4" text-anchor="middle">pont UniFFI Kotlin</text><path d="M708.0 318.0 L708.0 384.0" fill="none" stroke="#635CE4" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m635CE4)"/><rect x="645.6" y="338.8" width="124.8" height="22.5" rx="11.25" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.2"/><text x="708.0" y="354.0" font-size="11.5" font-weight="700" fill="#635CE4" text-anchor="middle">pont UniFFI Swift</text><rect x="32.0" y="386.0" width="896.0" height="74.0" rx="10" fill="#F3E8FB" stroke="#882DCD" stroke-width="2"/><text x="46.0" y="418.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Cœur Rust</text><text x="46.0" y="437.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Le même que sur Mac, Windows et Linux</text><rect x="32.0" y="484.0" width="14.0" height="14.0" rx="4" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.4"/><text x="53.0" y="495.5" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Écrans partagés</text><rect x="168.1" y="484.0" width="14.0" height="14.0" rx="4" fill="#E1F3EA" stroke="#15724A" stroke-width="1.4"/><text x="189.1" y="495.5" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Code propre au système</text><rect x="349.4" y="484.0" width="14.0" height="14.0" rx="4" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.4"/><text x="370.4" y="495.5" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Pont</text><rect x="418.0" y="484.0" width="14.0" height="14.0" rx="4" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.4"/><text x="439.0" y="495.5" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Cœur</text><use href="#i-telephone" x="898.0" y="112.0" width="18" height="18" color="#1E6CCC"/><use href="#i-code" x="442.0" y="226.0" width="18" height="18" color="#15724A"/><use href="#i-code" x="898.0" y="226.0" width="18" height="18" color="#15724A"/><use href="#i-coeur" x="898.0" y="398.0" width="18" height="18" color="#882DCD"/></svg>
