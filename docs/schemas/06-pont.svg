<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" role="img" aria-label="Le pont : comment chaque app appelle le cœur" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Le pont : comment chaque app appelle le cœur</title><defs><symbol id="i-coeur" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></symbol><symbol id="i-pont" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17.5h20M3.5 17.5v-3a8.5 8.5 0 0 1 17 0v3M8 17.5v-5M12 17.5v-6.5M16 17.5v-5"/></symbol><symbol id="i-telephone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol><symbol id="i-mac" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M12 16.5v3.5M8.5 20h7"/></symbol><symbol id="i-ordinateur" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></symbol><marker id="m635CE4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#635CE4"/></marker><marker id="m882DCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#882DCD"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="534.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Le pont : comment chaque app appelle le cœur</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">UniFFI est l'interprète : le cœur est écrit une fois, il le traduit pour Kotlin et pour Swift.</text><rect x="32.0" y="118.0" width="236.0" height="136.0" rx="10" fill="#F3E8FB" stroke="#882DCD" stroke-width="2"/><text x="46.0" y="172.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Cœur Rust</text><text x="46.0" y="191.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Les fonctions à exposer</text><text x="46.0" y="209.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">sont marquées dans le code</text><rect x="348.0" y="118.0" width="212.0" height="136.0" rx="10" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.5"/><text x="362.0" y="172.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">UniFFI</text><text x="362.0" y="191.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Génère le code du pont</text><text x="362.0" y="209.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">à chaque compilation</text><rect x="648.0" y="104.0" width="280.0" height="70.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="662.0" y="134.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Code Kotlin généré</text><text x="662.0" y="153.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Android</text><rect x="648.0" y="198.0" width="280.0" height="70.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="662.0" y="228.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Code Swift généré</text><text x="662.0" y="247.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">iPhone et Mac</text><rect x="648.0" y="292.0" width="280.0" height="70.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="662.0" y="322.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Windows et Linux, dans Tauri</text><text x="662.0" y="341.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Déjà en Rust : appel direct, sans pont</text><path d="M268.0 186.0 L344.0 186.0" fill="none" stroke="#635CE4" stroke-width="2" stroke-linejoin="round" marker-end="url(#m635CE4)"/><path d="M560.0 160.0 L604.0 160.0 L604.0 139.0 L644.0 139.0" fill="none" stroke="#635CE4" stroke-width="2" stroke-linejoin="round" marker-end="url(#m635CE4)"/><path d="M560.0 212.0 L604.0 212.0 L604.0 233.0 L644.0 233.0" fill="none" stroke="#635CE4" stroke-width="2" stroke-linejoin="round" marker-end="url(#m635CE4)"/><path d="M150.0 254.0 L150.0 327.0 L644.0 327.0" fill="none" stroke="#882DCD" stroke-width="2" stroke-linejoin="round" marker-end="url(#m882DCD)"/><rect x="32.0" y="398.0" width="896.0" height="110.0" rx="14" fill="#F3F2F7" stroke="#8A8895" stroke-width="1.5" stroke-dasharray="6 5"/><text x="52.0" y="426.0" font-size="14" font-weight="700" fill="#121117" text-anchor="start">Dans l'autre sens : la façade prête au cœur ce que seul le système sait faire</text><rect x="52.0" y="444.0" width="81.4" height="34.0" rx="17" fill="#FFFFFF" stroke="#1E6CCC" stroke-width="1.3"/><text x="92.7" y="465.5" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Le micro</text><rect x="145.4" y="444.0" width="241.4" height="34.0" rx="17" fill="#FFFFFF" stroke="#1E6CCC" stroke-width="1.3"/><text x="266.1" y="465.5" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Les permissions et les notifications</text><rect x="398.8" y="444.0" width="327.5" height="34.0" rx="17" fill="#FFFFFF" stroke="#1E6CCC" stroke-width="1.3"/><text x="562.5" y="465.5" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">L'IA du système : Apple Intelligence, Gemini Nano</text><text x="52.0" y="497.0" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Le cœur décrit ce dont il a besoin, chaque façade le fournit à sa manière.</text><use href="#i-coeur" x="238.0" y="130.0" width="18" height="18" color="#882DCD"/><use href="#i-pont" x="530.0" y="130.0" width="18" height="18" color="#635CE4"/><use href="#i-telephone" x="898.0" y="116.0" width="18" height="18" color="#1E6CCC"/><use href="#i-mac" x="898.0" y="210.0" width="18" height="18" color="#1E6CCC"/><use href="#i-ordinateur" x="898.0" y="304.0" width="18" height="18" color="#1E6CCC"/></svg>
