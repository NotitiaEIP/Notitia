"/><text x="356.0" y="338.3" font-size="13.5" font-weight="700" fill="#121117" text-anchor="start">Stockage chiffré</text><text x="356.0" y="356.6" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Suppression de l’audio à 30 jours</text><rect x="632.0" y="312.0" width="274.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="646.0" y="338.3" font-size="13.5" font-weight="700" fill="#121117" text-anchor="start">Enregistrement</text><text x="646.0" y="356.6" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Découpe, compression, disque</text><rect x="52.0" y="386.0" width="274.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="66.0" y="412.3" font-size="13.5" font-weight="700" fill="#121117" text-anchor="start">Transcription</text><text x="66.0" y="430.6" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Qui a dit quoi</text><rect x="342.0" y="386.0" width="274.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="356.0" y="412.3" font-size="13.5" font-weight="700" fill="#121117" text-anchor="start">Compte rendu</text><text x="356.0" y="430.6" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Décisions, actions, responsables</text><rect x="632.0" y="386.0" width="274.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="646.0" y="412.3" font-size="13.5" font-weight="700" fill="#121117" text-anchor="start">Recherche et lien</text><text x="646.0" y="430.6" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Entre les appareils reliés</text><rect x="32.0" y="512.0" width="288.0" height="88.0" rx="10" fill="#E3F4F1" stroke="#0E7C70" stroke-width="1.5"/><text x="46.0" y="542.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Moteurs d'IA sur l'appareil</text><text x="46.0" y="561.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Whisper, llama,</text><text x="46.0" y="579.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">puis nos modèles maison</text><rect x="336.0" y="512.0" width="288.0" height="88.0" rx="10" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.5"/><text x="350.0" y="542.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Disque de l'appareil</text><text x="350.0" y="561.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Fichiers chiffrés,</text><text x="350.0" y="579.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">rien ne sort</text><rect x="640.0" y="512.0" width="288.0" height="88.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="654.0" y="542.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Fourni par la façade</text><text x="654.0" y="561.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Micro, permissions,</text><text x="654.0" y="579.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">IA du système quand elle existe</text><path d="M176.0 472.0 L176.0 510.0" fill="none" stroke="#0E7C70" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m0E7C70)"/><path d="M480.0 472.0 L480.0 510.0" fill="none" stroke="#5E5C69" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m5E5C69)"/><path d="M784.0 512.0 L784.0 474.0" fill="none" stroke="#1E6CCC" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1E6CCC)"/><rect x="32.0" y="618.0" width="14.0" height="14.0" rx="4" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.4"/><text x="53.0" y="629.5" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Interface</text><rect x="126.5" y="618.0" width="14.0" height="14.0" rx="4" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.4"/><text x="147.5" y="629.5" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Pont</text><rect x="195.2" y="618.0