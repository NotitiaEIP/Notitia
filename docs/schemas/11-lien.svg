<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Le lien entre le téléphone et l'ordinateur, en trois marches" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Le lien entre le téléphone et l'ordinateur, en trois marches</title><rect x="0.75" y="0.75" width="958.5" height="468.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Le lien entre le téléphone et l'ordinateur, en trois marches</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Toujours sans compte ni serveur : les appareils se parlent directement.</text><rect x="32.0" y="220.0" width="288.0" height="168.0" rx="12" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.6"/><rect x="48.0" y="236.8" width="110.9" height="22.5" rx="11.25" fill="#5E5C69" stroke="#5E5C69" stroke-width="0"/><text x="103.5" y="252.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bêta, 14 février</text><text x="48.0" y="286.0" font-size="15" font-weight="700" fill="#121117" text-anchor="start">1. Par fichier</text><text x="48.0" y="310.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Le téléphone exporte la réunion</text><text x="48.0" y="328.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">en fichier .notitia,</text><text x="48.0" y="346.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">l'ordinateur l'ouvre.</text><rect x="336.0" y="166.0" width="288.0" height="222.0" rx="12" fill="#FBE7F0" stroke="#C2266F" stroke-width="1.6"/><rect x="352.0" y="182.8" width="130.6" height="22.5" rx="11.25" fill="#C2266F" stroke="#C2266F" stroke-width="0"/><text x="417.3" y="198.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jalon M4, 28 mars</text><text x="352.0" y="232.0" font-size="15" font-weight="700" fill="#121117" text-anchor="start">2. Synchro sur le même réseau</text><text x="352.0" y="256.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Appairage par QR code,</text><text x="352.0" y="274.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">chiffré de bout en bout,</text><text x="352.0" y="292.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">les réunions se suivent seules.</text><rect x="640.0" y="112.0" width="288.0" height="276.0" rx="12" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.6"/><rect x="656.0" y="128.8" width="64.1" height="22.5" rx="11.25" fill="#882DCD" stroke="#882DCD" stroke-width="0"/><text x="688.0" y="144.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ensuite</text><text x="656.0" y="178.0" font-size="15" font-weight="700" fill="#121117" text-anchor="start">3. L'ordinateur calcule</text><text x="656.0" y="202.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Le téléphone enregistre,</text><text x="656.0" y="220.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">l'ordinateur, plus puissant,</text><text x="656.0" y="238.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">transcrit à sa place.</text><rect x="32.0" y="404.0" width="896.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="480.0" y="428.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Même format .notitia et même cœur des deux côtés : c’est ce qui rend les trois marches possibles.</text></svg>
