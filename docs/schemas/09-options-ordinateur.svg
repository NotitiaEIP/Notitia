<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 502" width="960" height="502" role="img" aria-label="Windows et Linux : cinq façons de faire l'interface" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Windows et Linux : cinq façons de faire l'interface</title><rect x="0.75" y="0.75" width="958.5" height="500.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Windows et Linux : cinq façons de faire l'interface</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Toutes peuvent afficher la même charte. Elles diffèrent par le poids et par le travail à fournir.</text><text x="44.0" y="106.0" font-size="11" font-weight="700" fill="#5E5C69" text-anchor="start">OPTION</text><text x="258.0" y="106.0" font-size="11" font-weight="700" fill="#5E5C69" text-anchor="start">CE QUE C'EST</text><text x="566.0" y="106.0" font-size="11" font-weight="700" fill="#5E5C69" text-anchor="middle">POIDS</text><text x="656.0" y="106.0" font-size="11" font-weight="700" fill="#5E5C69" text-anchor="middle">INTERFACES</text><text x="818.0" y="106.0" font-size="11" font-weight="700" fill="#5E5C69" text-anchor="middle">VERDICT</text><rect x="32.0" y="118.0" width="896.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.3"/><text x="44.0" y="142.0" font-size="14" font-weight="700" fill="#121117" text-anchor="start">Electron</text><text x="44.0" y="160.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="start">Granola, 1Password, Signal</text><text x="258.0" y="151.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Pages web et Chromium embarqué</text><circle cx="548" cy="146" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="566" cy="146" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="584" cy="146" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><text x="656.0" y="151.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">1</text><rect x="716.0" y="134.5" width="204.0" height="23.0" rx="11.5" fill="#FBE6E5" stroke="#BF2D2A" stroke-width="1.2"/><text x="818.0" y="150.2" font-size="12" font-weight="700" fill="#BF2D2A" text-anchor="middle">Écartée : la plus lourde</text><rect x="32.0" y="184.0" width="896.0" height="56.0" rx="10" fill="#E1F3EA" fill-opacity="0.45" stroke="#15724A" stroke-width="2"/><text x="44.0" y="208.0" font-size="14" font-weight="700" fill="#121117" text-anchor="start">Tauri</text><text x="44.0" y="226.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="start">Hyprnote, Meetily</text><text x="258.0" y="217.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Pages web et moteur web du système</text><circle cx="548" cy="212" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="566" cy="212" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><circle cx="584" cy="212" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><text x="656.0" y="217.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">1</text><rect x="716.0" y="200.5" width="204.0" height="23.0" rx="11.5" fill="#E1F3EA" stroke="#15724A" stroke-width="1.2"/><text x="818.0" y="216.2" font-size="12" font-weight="700" fill="#15724A" text-anchor="middle">Retenue</text><rect x="32.0" y="250.0" width="896.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.3"/><text x="44.0" y="274.0" font-size="14" font-weight="700" fill="#121117" text-anchor="start">Compose Desktop</text><text x="44.0" y="292.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="start">JetBrains Toolbox</text><text x="258.0" y="283.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Écrans Kotlin et Java embarqué</text><circle cx="548" cy="278" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="566" cy="278" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="584" cy="278" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><text x="656.0" y="283.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">1</text><rect x="716.0" y="266.5" width="204.0" height="23.0" rx="11.5" fill="#FCEFD9" stroke="#A35200" stroke-width="1.2"/><text x="818.0" y="282.2" font-size="12" font-weight="700" fill="#A35200" text-anchor="middle">Écartée avec le cœur Kotlin</text><rect x="32.0" y="316.0" width="896.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.3"/><text x="44.0" y="340.0" font-size="14" font-weight="700" fill="#121117" text-anchor="start">Dessinée en Rust</text><text x="44.0" y="358.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="start">Discord (annoncé), Zed</text><text x="258.0" y="349.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Tout en Rust, sans moteur web</text><circle cx="548" cy="344" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="566" cy="344" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><circle cx="584" cy="344" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><text x="656.0" y="349.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">1</text><rect x="716.0" y="332.5" width="204.0" height="23.0" rx="11.5" fill="#FCEFD9" stroke="#A35200" stroke-width="1.2"/><text x="818.0" y="348.2" font-size="12" font-weight="700" fill="#A35200" text-anchor="middle">Trop jeune, à revoir</text><rect x="32.0" y="382.0" width="896.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.3"/><text x="44.0" y="406.0" font-size="14" font-weight="700" fill="#121117" text-anchor="start">Native par système</text><text x="44.0" y="424.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="start">Microsoft Office</text><text x="258.0" y="415.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">SwiftUI, WinUI, GTK</text><circle cx="548" cy="410" r="6" fill="#121117" stroke="#121117" stroke-width="1.3"/><circle cx="566" cy="410" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><circle cx="584" cy="410" r="6" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.3"/><text x="656.0" y="415.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">3</text><rect x="716.0" y="398.5" width="204.0" height="23.0" rx="11.5" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.2"/><text x="818.0" y="414.2" font-size="12" font-weight="700" fill="#5E5C69" text-anchor="middle">Gardée pour le Mac</text><text x="32.0" y="478.0" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Le poids est un ordre de grandeur tiré de ce que chaque option embarque, pas une mesure. Le prototype le mesurera.</text></svg>
