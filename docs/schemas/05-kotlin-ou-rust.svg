<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 618" width="960" height="618" role="img" aria-label="Cœur Kotlin ou cœur Rust : la balance honnête" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Cœur Kotlin ou cœur Rust : la balance honnête</title><rect x="0.75" y="0.75" width="958.5" height="616.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Cœur Kotlin ou cœur Rust : la balance honnête</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Chaque ligne est un critère. La case colorée est le côté qui gagne.</text><rect x="32.0" y="96.0" width="336.0" height="52.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="200.0" y="126.6" font-size="14.5" font-weight="700" fill="#121117" text-anchor="middle">Cœur Kotlin et Compose Desktop</text><rect x="592.0" y="96.0" width="336.0" height="52.0" rx="10" fill="#F3E8FB" stroke="#882DCD" stroke-width="2.2"/><text x="760.0" y="126.6" font-size="14.5" font-weight="700" fill="#121117" text-anchor="middle">Cœur Rust et Tauri, retenu</text><text x="480.0" y="189.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Délai</text><rect x="32.0" y="166.0" width="336.0" height="36.0" rx="8" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.6"/><circle cx="52" cy="184" r="7.5" fill="#15724A"/><path d="M48.4 184.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="188.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Rien à réécrire</text><rect x="592.0" y="166.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="608.0" y="188.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Cœur à réécrire, jalon M1 décalé</text><text x="480.0" y="235.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Interfaces à tenir</text><rect x="32.0" y="212.0" width="336.0" height="36.0" rx="8" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.6"/><circle cx="52" cy="230" r="7.5" fill="#15724A"/><path d="M48.4 230.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="234.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">2 : Compose, SwiftUI</text><rect x="592.0" y="212.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="608.0" y="234.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">3 : Compose, SwiftUI, web</text><text x="480.0" y="281.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Langages</text><rect x="32.0" y="258.0" width="336.0" height="36.0" rx="8" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.6"/><circle cx="52" cy="276" r="7.5" fill="#15724A"/><path d="M48.4 276.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="280.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Kotlin, Swift</text><rect x="592.0" y="258.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="608.0" y="280.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Rust, Kotlin, Swift, TypeScript</text><text x="480.0" y="327.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Relecture du code</text><rect x="32.0" y="304.0" width="336.0" height="36.0" rx="8" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.6"/><circle cx="52" cy="322" r="7.5" fill="#15724A"/><path d="M48.4 322.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="326.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Toute l'équipe mobile</text><rect x="592.0" y="304.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="608.0" y="326.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Deux relecteurs au départ</text><text x="480.0" y="373.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Rendu sur Linux</text><rect x="32.0" y="350.0" width="336.0" height="36.0" rx="8" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.6"/><circle cx="52" cy="368" r="7.5" fill="#15724A"/><path d="M48.4 368.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="372.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Identique sur toutes les machines</text><rect x="592.0" y="350.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="608.0" y="372.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Dépend du moteur web du système</text><text x="480.0" y="419.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Audio et IA sur ordinateur</text><rect x="32.0" y="396.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="48.0" y="418.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Programmes natifs à côté du cœur</text><rect x="592.0" y="396.0" width="336.0" height="36.0" rx="8" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.6"/><circle cx="612" cy="414" r="7.5" fill="#15724A"/><path d="M608.4 414.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="630.0" y="418.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Directement dans le cœur</text><text x="480.0" y="465.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Poids de l'app ordinateur</text><rect x="32.0" y="442.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="48.0" y="464.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Lourd : Java embarqué</text><rect x="592.0" y="442.0" width="336.0" height="36.0" rx="8" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.6"/><circle cx="612" cy="460" r="7.5" fill="#15724A"/><path d="M608.4 460.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="630.0" y="464.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Léger : la mémoire reste aux modèles</text><text x="480.0" y="511.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">Lecteur d'écran sur Linux</text><rect x="32.0" y="488.0" width="336.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.2"/><text x="48.0" y="510.5" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Non pris en charge</text><rect x="592.0" y="488.0" width="336.0" height="36.0" rx="8" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.6"/><circle cx="612" cy="506" r="7.5" fill="#15724A"/><path d="M608.4 506.2l2.6 2.8l4.8-5.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="630.0" y="510.5" font-size="12.5" font-weight="700" fill="#121117" text-anchor="start">Par le moteur web, à vérifier</text><text x="480.0" y="560.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Le cœur Kotlin gagne à court terme : 5 critères sur 8. Le cœur Rust est retenu pour le long terme :</text><text x="480.0" y="579.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">les fondations se posent une seule fois, et l'audio comme l'IA vivent dans le cœur.</text></svg>
