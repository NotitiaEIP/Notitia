<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Vue d'ensemble : tout se passe sur les appareils de l'utilisateur" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Vue d'ensemble : tout se passe sur les appareils de l'utilisateur</title><defs><marker id="m882DCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#882DCD"/></marker><marker id="mC2266F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2266F"/></marker><marker id="mBF2D2A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#BF2D2A"/></marker><marker id="m5E5C69" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E5C69"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="538.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Vue d'ensemble : tout se passe sur les appareils de l'utilisateur</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Le téléphone enregistre en présentiel, l'ordinateur en visio. Les deux se relient sans serveur.</text><rect x="32.0" y="96.0" width="640.0" height="412.0" rx="14" fill="#F3F2F7" stroke="#8A8895" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54.0" y="122.0" font-size="11.5" font-weight="700" fill="#5E5C69" text-anchor="start">CHEZ L'UTILISATEUR</text><rect x="56.0" y="138.0" width="250.0" height="124.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="70.0" y="177.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Téléphone</text><text x="70.0" y="196.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Android et iPhone</text><text x="70.0" y="214.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Réunion en présentiel</text><text x="70.0" y="232.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Micro du téléphone</text><rect x="398.0" y="138.0" width="250.0" height="124.0" rx="10" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="412.0" y="177.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Ordinateur</text><text x="412.0" y="196.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Mac, Windows, Linux</text><text x="412.0" y="214.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Réunion en visio, sans bot</text><text x="412.0" y="232.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Son de la visio et micro</text><path d="M181.0 262.0 L181.0 318.0" fill="none" stroke="#882DCD" stroke-width="2" stroke-linejoin="round" marker-end="url(#m882DCD)"/><path d="M523.0 262.0 L523.0 318.0" fill="none" stroke="#882DCD" stroke-width="2" stroke-linejoin="round" marker-end="url(#m882DCD)"/><rect x="136.0" y="272.8" width="90.0" height="22.5" rx="11.25" fill="#882DCD" stroke="#882DCD" stroke-width="0"/><text x="181.0" y="288.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cœur Notitia</text><rect x="478.0" y="272.8" width="90.0" height="22.5" rx="11.25" fill="#882DCD" stroke="#882DCD" stroke-width="0"/><text x="523.0" y="288.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cœur Notitia</text><path d="M314.0 200.0 L390.0 200.0" fill="none" stroke="#C2266F" stroke-width="2" stroke-linejoin="round" marker-end="url(#mC2266F)" marker-start="url(#mC2266F)"/><text x="352.0" y="188.0" font-size="12" font-weight="700" fill="#C2266F" text-anchor="middle">Lien chiffré</text><text x="352.0" y="220.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">sans compte</text><text x="352.0" y="235.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">ni serveur</text><rect x="56.0" y="320.0" width="592.0" height="164.0" rx="12" fill="#E3F4F1" stroke="#0E7C70" stroke-width="1.5"/><text x="74.0" y="346.0" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Ce que le cœur produit, sur place</text><rect x="72.0" y="362.0" width="176.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="86.0" y="400.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Transcription</text><text x="86.0" y="419.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Qui a dit quoi,</text><text x="86.0" y="437.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">phrase par phrase</text><rect x="264.0" y="362.0" width="176.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="278.0" y="400.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Compte rendu</text><text x="278.0" y="419.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Décisions et actions,</text><text x="278.0" y="437.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">une par ligne</text><rect x="456.0" y="362.0" width="176.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#8A8895" stroke-width="1.5"/><text x="470.0" y="400.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Recherche</text><text x="470.0" y="419.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Dans toutes</text><text x="470.0" y="437.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">les réunions</text><rect x="704.0" y="138.0" width="224.0" height="124.0" rx="10" fill="#FBE6E5" stroke="#BF2D2A" stroke-width="1.5"/><text x="718.0" y="177.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Aucun serveur Notitia</text><text x="718.0" y="196.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Pas de compte</text><text x="718.0" y="214.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Pas de sauvegarde cloud</text><text x="718.0" y="232.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Pas de calcul en ligne</text><path d="M674.0 200.0 L702.0 200.0" fill="none" stroke="#BF2D2A" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="688" cy="200" r="9" fill="#BF2D2A"/><path d="M684.8 196.8l6.4 6.4M691.2 196.8l-6.4 6.4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><rect x="704.0" y="320.0" width="224.0" height="164.0" rx="10" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.5"/><text x="718.0" y="370.4" font-size="14.5" font-weight="700" fill="#121117" text-anchor="start">Ce qui peut sortir</text><text x="718.0" y="389.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">Seulement par un geste</text><text x="718.0" y="407.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">de l'utilisateur :</text><text x="718.0" y="425.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">un compte rendu envoyé,</text><text x="718.0" y="443.2" font-size="12.5" font-weight="400" fill="#5E5C69" text-anchor="start">un export complet.</text><path d="M674.0 402.0 L700.0 402.0" fill="none" stroke="#5E5C69" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m5E5C69)"/></svg>
