<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512" role="img" aria-label="La feuille de route jusqu'au jalon M4" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>La feuille de route jusqu'au jalon M4</title><rect x="0.75" y="0.75" width="958.5" height="510.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">La feuille de route jusqu'au jalon M4</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Proposition du 15 novembre 2026. M1 passe du 6 au 20 décembre, les autres dates ne bougent pas.</text><rect x="444.5" y="142.0" width="63.7" height="296.0" rx="6" fill="#F3F2F7" stroke="#F3F2F7" stroke-width="0"/><text x="476.3" y="454.0" font-size="11" font-weight="400" fill="#8A8895" text-anchor="middle">pause</text><line x1="346.4" y1="142" x2="346.4" y2="438" stroke="#E5E3EA" stroke-width="1"/><text x="351.4" y="454.0" font-size="11" font-weight="400" fill="#8A8895" text-anchor="start">déc.</text><line x1="498.4" y1="142" x2="498.4" y2="438" stroke="#E5E3EA" stroke-width="1"/><text x="503.4" y="454.0" font-size="11" font-weight="400" fill="#8A8895" text-anchor="start">janv.</text><line x1="650.4" y1="142" x2="650.4" y2="438" stroke="#E5E3EA" stroke-width="1"/><text x="655.4" y="454.0" font-size="11" font-weight="400" fill="#8A8895" text-anchor="start">févr.</text><line x1="787.6" y1="142" x2="787.6" y2="438" stroke="#E5E3EA" stroke-width="1"/><text x="792.6" y="454.0" font-size="11" font-weight="400" fill="#8A8895" text-anchor="start">mars</text><line x1="439.6" y1="136" x2="439.6" y2="438" stroke="#121117" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M439.6 126l7 7l-7 7l-7-7z" fill="#121117"/><text x="439.6" y="104.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="middle">M1</text><text x="439.6" y="119.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="middle">20 déc.</text><line x1="645.5" y1="136" x2="645.5" y2="438" stroke="#121117" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M645.5 126l7 7l-7 7l-7-7z" fill="#121117"/><text x="633.5" y="116.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="end">M2</text><text x="633.5" y="131.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="end">31 janv.</text><line x1="714.1" y1="136" x2="714.1" y2="438" stroke="#BF2D2A" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M714.1 126l7 7l-7 7l-7-7z" fill="#BF2D2A"/><text x="726.1" y="116.0" font-size="12.5" font-weight="700" fill="#BF2D2A" text-anchor="start">M3 Bêta</text><text x="726.1" y="131.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="start">14 févr.</text><line x1="920.0" y1="136" x2="920.0" y2="438" stroke="#121117" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M920.0 126l7 7l-7 7l-7-7z" fill="#121117"/><text x="908.0" y="116.0" font-size="12.5" font-weight="700" fill="#121117" text-anchor="end">M4</text><text x="908.0" y="131.0" font-size="11.5" font-weight="400" fill="#5E5C69" text-anchor="end">28 mars</text><text x="32.0" y="171.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Preuve du pont, Android et iPhone</text><rect x="272.9" y="156.0" width="34.3" height="22.0" rx="11" fill="#ECEBFC" stroke="#635CE4" stroke-width="1.5"/><text x="32.0" y="207.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Format et stockage chiffré</text><rect x="307.2" y="192.0" width="68.6" height="22.0" rx="11" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.5"/><text x="32.0" y="243.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Enregistrement : audio sur disque</text><rect x="375.8" y="228.0" width="68.6" height="22.0" rx="11" fill="#F3E8FB" stroke="#882DCD" stroke-width="1.5"/><text x="32.0" y="279.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Transcription et compte rendu</text><rect x="513.1" y="264.0" width="137.3" height="22.0" rx="11" fill="#E3F4F1" stroke="#0E7C70" stroke-width="1.5"/><text x="32.0" y="315.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Recherche, téléphone prêt à la bêta</text><rect x="650.4" y="300.0" width="68.6" height="22.0" rx="11" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="32.0" y="351.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Ordinateur : Windows et Linux</text><rect x="719.0" y="336.0" width="205.9" height="22.0" rx="11" fill="#E8F0FB" stroke="#1E6CCC" stroke-width="1.5"/><text x="32.0" y="387.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Lien entre téléphone et ordinateur</text><rect x="787.6" y="372.0" width="137.3" height="22.0" rx="11" fill="#FBE7F0" stroke="#C2266F" stroke-width="1.5"/><text x="32.0" y="423.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="start">Mac branché sur le cœur</text><rect x="719.0" y="408.0" width="205.9" height="22.0" rx="11" fill="#F3F2F7" stroke="#5E5C69" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32.0" y="490.0" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">Le Mac se branche quand Lucas est disponible. Chaque barre deviendra une ou plusieurs issues du Project.</text></svg>
