<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Où se fait le calcul : la carte des concurrents" font-family="'Schibsted Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><title>Où se fait le calcul : la carte des concurrents</title><defs><symbol id="i-nuage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.6A3.5 3.5 0 0 0 7 18.5z"/></symbol><symbol id="i-ordinateur" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></symbol><symbol id="i-appareils" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="13" height="10" rx="1.5"/><path d="M1.5 18.5h13"/><rect x="16.5" y="9" width="6" height="11" rx="1.5"/></symbol><marker id="m5E5C69" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E5C69"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="498.5" rx="16" fill="#FFFFFF" stroke="#E5E3EA" stroke-width="1.5"/><text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#121117" text-anchor="start">Où se fait le calcul : la carte des concurrents</text><text x="32.0" y="70.0" font-size="13.5" font-weight="400" fill="#5E5C69" text-anchor="start">Vérifié le 14 novembre 2026, sur leurs offres d'emploi, leurs articles et leurs dépôts de code.</text><rect x="32.0" y="100.0" width="288.0" height="300.0" rx="14" fill="#FCEFD9" stroke="#A35200" stroke-width="1.5"/><text x="191.0" y="132.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">Calcul dans le cloud</text><rect x="56.0" y="156.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#A35200" stroke-width="1.2"/><text x="112.0" y="176.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Granola</text><rect x="184.0" y="156.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#A35200" stroke-width="1.2"/><text x="240.0" y="176.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Plaud</text><rect x="56.0" y="200.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#A35200" stroke-width="1.2"/><text x="112.0" y="220.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Otter</text><rect x="184.0" y="200.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#A35200" stroke-width="1.2"/><text x="240.0" y="220.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Fireflies</text><rect x="56.0" y="244.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#A35200" stroke-width="1.2"/><text x="112.0" y="264.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Jamie</text><rect x="184.0" y="244.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#A35200" stroke-width="1.2"/><text x="240.0" y="264.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Circleback</text><text x="176.0" y="346.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Ordinateur et mobile, mais la voix</text><text x="176.0" y="364.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">ou le texte part sur leurs serveurs.</text><rect x="336.0" y="100.0" width="288.0" height="300.0" rx="14" fill="#E3F4F1" stroke="#0E7C70" stroke-width="1.5"/><text x="495.0" y="132.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">Calcul sur l'ordinateur</text><rect x="360.0" y="156.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#0E7C70" stroke-width="1.2"/><text x="416.0" y="176.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Hyprnote</text><rect x="488.0" y="156.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#0E7C70" stroke-width="1.2"/><text x="544.0" y="176.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">Meetily</text><rect x="360.0" y="200.0" width="112.0" height="32.0" rx="16" fill="#FFFFFF" stroke="#0E7C70" stroke-width="1.2"/><text x="416.0" y="220.5" font-size="13" font-weight="700" fill="#121117" text-anchor="middle">OpenWhispr</text><text x="480.0" y="346.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Rien ne sort, mais pas de cœur</text><text x="480.0" y="364.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">partagé avec un téléphone.</text><rect x="640.0" y="100.0" width="288.0" height="300.0" rx="14" fill="#F3E8FB" stroke="#882DCD" stroke-width="2.2"/><text x="799.0" y="132.0" font-size="15" font-weight="700" fill="#121117" text-anchor="middle">Calcul sur tous tes appareils</text><rect x="709.0" y="216.0" width="150.0" height="28.0" rx="14.0" fill="#882DCD" stroke="#882DCD" stroke-width="0"/><text x="784.0" y="235.9" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Notitia</text><text x="784.0" y="268.0" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="middle">la place visée</text><text x="784.0" y="346.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">Téléphone et ordinateur partagent</text><text x="784.0" y="364.0" font-size="12.5" font-weight="400" fill="#121117" text-anchor="middle">le même cœur, reliés sans serveur.</text><path d="M40.0 440.0 L920.0 440.0" fill="none" stroke="#5E5C69" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m5E5C69)"/><text x="40.0" y="464.0" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="start">la réunion quitte l’appareil</text><text x="920.0" y="464.0" font-size="12" font-weight="400" fill="#5E5C69" text-anchor="end">la réunion reste sur l’appareil</text><use href="#i-nuage" x="86.0" y="114.5" width="18" height="18" color="#A35200"/><use href="#i-ordinateur" x="378.8" y="114.5" width="18" height="18" color="#0E7C70"/><use href="#i-appareils" x="660.2" y="114.5" width="18" height="18" color="#882DCD"/></svg>
