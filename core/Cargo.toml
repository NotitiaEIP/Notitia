[package]
name = "notitia-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib for Android, staticlib for the iPhone, lib for the tests.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing"] }
# Exact: UniFFI is not 1.0 yet, and its generated code must match the library it talks to.
uniffi = "=0.32.2"

[workspace]
members = ["uniffi-bindgen"]
